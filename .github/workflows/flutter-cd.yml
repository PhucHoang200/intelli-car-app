name: Flutter CD (Firebase App Distribution)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.8"
          channel: stable
          cache: true

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # BƯỚC MỚI: Tự động ghi đè Kotlin version trong Gradle files ngay trên CI/CD
      - name: Override Kotlin Version for CI
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = "2.1.0"/' android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '2.1.0'/" android/build.gradle
          fi

      - name: Inject Firebase config
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: frontend/build/app/outputs/flutter-apk/app-release.apk
