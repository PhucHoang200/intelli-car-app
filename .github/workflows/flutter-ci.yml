name: Flutter CI (Android Debug)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Clean Flutter
        run: flutter clean

      - name: Force Upgrade Kotlin Version on CI
        run: |
          find android/ -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i -E \
            -e 's/id\s*\("org.jetbrains.kotlin.android"\)\s*version\s*"[^"]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' \
            -e 's/id\s*'\''org.jetbrains.kotlin.android'\''\s*version\s*'\''[^'\'']+'\''/id "org.jetbrains.kotlin.android" version "2.1.0"/g' \
            -e 's/ext\.kotlin_version\s*=\s*["'\''][^"'\'']+["'\'']/ext.kotlin_version = "2.1.0"/g' {} +
          echo "" >> android/gradle.properties
          echo "kotlinVersion=2.1.0" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Analyze project
        run: flutter analyze || true

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: flutter test || true

      # SỬA LỖI TẠI ĐÂY: Xóa `-- -PkotlinVersion=2.1.0` và truyền qua env GRADLE_OPTS
      - name: Build APK (debug)
        if: github.event_name == 'push'
        env:
          GRADLE_OPTS: "-Dorg.gradle.project.kotlinVersion=2.1.0"
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: online-car-marketplace-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
