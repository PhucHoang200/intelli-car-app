name: Flutter CI (Android Debug)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Clean Flutter
        run: flutter clean

      - name: Force Upgrade Kotlin Version to 2.3.0 on CI
        run: |
          # Ép phiên bản Kotlin 2.3.0 qua file gradle.properties
          echo "kotlinVersion=2.3.0" >> android/gradle.properties
          
          # Ép tất cả các module (bao gồm cả plugin của bên thứ 3) sử dụng đúng Kotlin 2.3.0
          # Bằng cách nối thêm cấu hình vào cuối file android/build.gradle
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                              details.useVersion '2.3.0'
                          }
                      }
                  }
              }
          }
          EOF

          # Nâng cấp classpath Kotlin plugin lên 2.3.0 cho build script (Dự án cũ)
          sed -i -E "s/ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]/ext.kotlin_version = '2.3.0'/g" android/build.gradle
          
          # Nâng cấp ID plugin Kotlin lên 2.3.0 (Dự án mới dùng settings.gradle)
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id\s*"org.jetbrains.kotlin.android"\s*version\s*"[^"]+"/id "org.jetbrains.kotlin.android" version "2.3.0"/g' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\s*\("org.jetbrains.kotlin.android"\)\s*version\s*"[^"]+"/id("org.jetbrains.kotlin.android") version "2.3.0"/g' android/settings.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Analyze project
        run: flutter analyze || true

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: flutter test || true

      - name: Build APK (debug)
        if: github.event_name == 'push'
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: online-car-marketplace-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
