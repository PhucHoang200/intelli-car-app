name: Flutter CI (Android Debug)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java Environment (BẮT BUỘC để tránh lỗi Kotlin/Gradle)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      # 4. Clean Flutter workspace
      - name: Clean Flutter
        run: flutter clean

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Inject Firebase config (Android)
      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # 7. Analyze project
      - name: Analyze project
        run: flutter analyze || true

      # 8. Run tests (Chỉ chạy khi có Pull Request)
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: flutter test || true

      # 9. Build APK debug (Chỉ chạy khi push main)
      - name: Build APK (debug)
        if: github.event_name == 'push'
        run: flutter build apk --debug

      # 10. Upload APK artifact (Đã sửa lại đường dẫn path đúng ngữ cảnh root)
      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: online-car-marketplace-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
