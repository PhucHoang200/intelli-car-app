name: Flutter CI (Android Debug)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # BƯỚC MỚI: Tự động ghi đè Kotlin version trong Gradle files ngay trên CI
      - name: Override Kotlin Version for CI
        run: |
          # 1. Nếu dự án dùng settings.gradle / settings.gradle.kts (Flutter 3.19+)
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle.kts
          fi
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          fi

          # 2. Nếu dự án cũ dùng ext.kotlin_version trong build.gradle / build.gradle.kts
          if [ -f android/build.gradle.kts ]; then
            sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = "2.1.0"/' android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '2.1.0'/" android/build.gradle
          fi

      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Analyze project
        run: flutter analyze || true

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: flutter test || true

      - name: Build APK (debug)
        if: github.event_name == 'push'
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: online-car-marketplace-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
